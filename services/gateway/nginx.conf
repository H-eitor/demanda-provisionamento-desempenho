server {
    listen 8080;

    location = / {
        default_type text/plain;
        return 200 "online\n";
    }

    location /cpu {
        proxy_pass http://app-cpu:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /memory {
        proxy_pass http://app-memory:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /io {
        proxy_pass http://app-io:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
